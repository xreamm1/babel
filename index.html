<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery of Babel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const PIXEL = 2; // размер "зерна" шума

function resize() {
  canvas.width = Math.ceil(window.innerWidth / PIXEL);
  canvas.height = Math.ceil(window.innerHeight / PIXEL);
}
window.addEventListener('resize', () => { resize(); paint(); });
resize();

function paint() {
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.random() * 256;
    data[i + 1] = Math.random() * 256;
    data[i + 2] = Math.random() * 256;
    data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function loop() {
  paint();
  setTimeout(loop, Math.random() * 9000 + 1000);
}
loop();
</script>
</body>
</html>
