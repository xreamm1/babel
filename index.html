<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery of Babel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #c { position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const text = document.createElement('canvas');
const tctx = text.getContext('2d');

const SCALE = 2; // внутреннее разрешение x2, чтобы зерно было 0.5 CSS-пикселя

function resize() {
  const w = window.innerWidth * SCALE, h = window.innerHeight * SCALE;
  canvas.width = w;
  canvas.height = h;
  text.width = w;
  text.height = h;
}
window.addEventListener('resize', resize);
resize();

const PHRASES = [
  ['SOMETHING', 'IS COMING'],
  ['THEY SEE', 'YOU'],
  ['WAKE', 'UP'],
  ['IT IS', 'HERE'],
  ['NOT', 'ALONE'],
  ['LOOK', 'BEHIND YOU'],
];
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function randomWord(len) {
  let s = '';
  for (let i = 0; i < len; i++) s += LETTERS[Math.floor(Math.random() * LETTERS.length)];
  return s;
}

function drawText() {
  const w = text.width, h = text.height;
  tctx.clearRect(0, 0, w, h);
  tctx.fillStyle = '#fff';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  const fontSize = Math.round(w / 9);
  tctx.font = `bold ${fontSize}px sans-serif`;

  let line1, line2;
  if (Math.random() < 0.15) {
    [line1, line2] = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  } else {
    line1 = randomWord(5 + Math.floor(Math.random() * 5));
    line2 = randomWord(4 + Math.floor(Math.random() * 6));
  }

  const cx = w * (0.3 + Math.random() * 0.4);
  const cy = h * (0.3 + Math.random() * 0.4);
  const y1 = cy - h * 0.06;
  const y2 = cy + h * 0.06;
  tctx.fillText(line1, cx, y1);
  tctx.fillText(line2, cx, y2);

  // только область с текстом — не нужно сканировать весь экран
  const halfWidth = Math.max(tctx.measureText(line1).width, tctx.measureText(line2).width) / 2;
  const pad = fontSize * 0.4;
  const x0 = Math.max(0, Math.floor(cx - halfWidth - pad));
  const x1 = Math.min(w, Math.ceil(cx + halfWidth + pad));
  const y0 = Math.max(0, Math.floor(y1 - fontSize * 0.7));
  const y1b = Math.min(h, Math.ceil(y2 + fontSize * 0.7));
  return { x0, y0, w: x1 - x0, h: y1b - y0 };
}

// "адрес" текущей картинки, как у книги в Библиотеке Вавилона
function randomAddress() {
  const chars = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < 24; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function drawAddress(W, H) {
  ctx.font = `${Math.round(H * 0.012)}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillText(randomAddress(), W - H * 0.015, H - H * 0.015);
}

function drawTimer(W, H) {
  ctx.font = `${Math.round(H * 0.018)}px monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText(String(timeLeft).padStart(2, '0'), H * 0.015, H * 0.015);
}

// волна от клика/тапа
const ripples = [];
function addRipple(x, y) {
  const wasEmpty = ripples.length === 0;
  ripples.push({ x: x * SCALE, y: y * SCALE, start: performance.now() });
  if (wasEmpty) requestAnimationFrame(() => drawRipples(canvas.width, canvas.height));
}
canvas.addEventListener('pointerdown', e => addRipple(e.clientX, e.clientY));

const WAVE_CHARS = '01XO+*#%&$ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function drawRipples(W, H) {
  const now = performance.now();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(H * 0.02)}px monospace`;

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    const t = (now - r.start) / 900;
    if (t >= 1) { ripples.splice(i, 1); continue; }
    const radius = t * H * 0.35;
    const count = Math.max(8, Math.floor(radius / (H * 0.025)));
    for (let a = 0; a < count; a++) {
      const angle = (a / count) * Math.PI * 2 + t * 3;
      const x = r.x + Math.cos(angle) * radius;
      const y = r.y + Math.sin(angle) * radius;
      // символы мерцают: то темнеют, то светлеют
      const flicker = 0.4 + 0.6 * Math.abs(Math.sin(now / 90 + a * 1.7));
      ctx.globalAlpha = (1 - t) * flicker;
      ctx.fillStyle = '#fff';
      const ch = WAVE_CHARS[Math.floor(Math.random() * WAVE_CHARS.length)];
      ctx.fillText(ch, x, y);
    }
  }
  ctx.restore();
  if (ripples.length) requestAnimationFrame(() => drawRipples(canvas.width, canvas.height));
}

// "залипшие" пиксели — несколько точек держат один цвет пару кадров
const stuckPixels = new Map();
function updateStuckPixels(W, H) {
  for (const [key, p] of stuckPixels) {
    p.life--;
    if (p.life <= 0) stuckPixels.delete(key);
  }
  if (Math.random() < 0.4) {
    const n = 5 + Math.floor(Math.random() * 20);
    for (let i = 0; i < n; i++) {
      const gx = Math.floor(Math.random() * W);
      const gy = Math.floor(Math.random() * H);
      stuckPixels.set(`${gx},${gy}`, {
        r: Math.random() < 0.5 ? 255 : 0,
        g: Math.random() < 0.5 ? 255 : 0,
        b: Math.random() < 0.5 ? 255 : 0,
        life: 2 + Math.floor(Math.random() * 3),
      });
    }
  }
}

// переиспользуем один и тот же буфер вместо аллокации каждую секунду
let cachedImg = null;
let cachedW = 0, cachedH = 0;

function paint() {
  const W = canvas.width, H = canvas.height;
  canvas.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;

  const bbox = drawText();

  if (!cachedImg || cachedW !== W || cachedH !== H) {
    cachedImg = ctx.createImageData(W, H);
    cachedW = W;
    cachedH = H;
  }
  const img = cachedImg;
  const buf32 = new Uint32Array(img.data.buffer);

  // один быстрый проход: 1 random на пиксель вместо 3 + ветвлений
  for (let i = 0; i < buf32.length; i++) {
    buf32[i] = 0xff000000 | ((Math.random() * 0x1000000) | 0);
  }

  // подсветка текста — только в его маленьком прямоугольнике, а не по всему экрану
  if (bbox.w > 0 && bbox.h > 0) {
    const boost = 22 + Math.random() * 12;
    const hue = Math.random() * Math.PI * 2;
    const boostR = boost * (0.5 + 0.5 * Math.cos(hue)) | 0;
    const boostG = boost * (0.5 + 0.5 * Math.cos(hue - 2.094)) | 0;
    const boostB = boost * (0.5 + 0.5 * Math.cos(hue + 2.094)) | 0;

    const mask = tctx.getImageData(bbox.x0, bbox.y0, bbox.w, bbox.h).data;
    for (let y = 0; y < bbox.h; y++) {
      for (let x = 0; x < bbox.w; x++) {
        if (mask[(y * bbox.w + x) * 4 + 3] === 0) continue;
        const idx = (bbox.y0 + y) * W + (bbox.x0 + x);
        const v = buf32[idx];
        const r = Math.min(255, (v & 0xff) + boostR);
        const g = Math.min(255, ((v >>> 8) & 0xff) + boostG);
        const b = Math.min(255, ((v >>> 16) & 0xff) + boostB);
        buf32[idx] = 0xff000000 | (b << 16) | (g << 8) | r;
      }
    }
  }

  // "залипшие" пиксели — точечно, без прохода по всему экрану
  updateStuckPixels(W, H);
  for (const [key, p] of stuckPixels) {
    const [gx, gy] = key.split(',');
    buf32[Number(gy) * W + Number(gx)] = 0xff000000 | (p.b << 16) | (p.g << 8) | p.r;
  }

  ctx.putImageData(img, 0, 0);

  // виньетка для атмосферы
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // редкий цифровой глитч
  if (Math.random() < 0.12) glitch(W, H);

  drawAddress(W, H);
  drawTimer(W, H);
}

function glitch(W, H) {
  const slices = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < slices; i++) {
    const y = Math.random() * H;
    const sh = 2 + Math.random() * H * 0.05;
    const dx = (Math.random() - 0.5) * W * 0.1;
    ctx.drawImage(canvas, 0, y, W, sh, dx, y, W, sh);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = `rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},0.06)`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

const CYCLE_SECONDS = 30;
let timeLeft = CYCLE_SECONDS;
let cycleDeadline = 0;
let lastPaintedSecond = -1;
let running = false;

function startCycle() {
  running = true;
  cycleDeadline = Date.now() + CYCLE_SECONDS * 1000;
  lastPaintedSecond = -1;
  tick();
}

function tick() {
  if (!running) return;
  const remainingMs = cycleDeadline - Date.now();
  timeLeft = Math.max(0, Math.ceil(remainingMs / 1000));

  const elapsedSecond = CYCLE_SECONDS - timeLeft;
  if (elapsedSecond !== lastPaintedSecond) {
    lastPaintedSecond = elapsedSecond;
    paint();
  }

  if (remainingMs <= 0) {
    blackout();
    return;
  }
  requestAnimationFrame(tick);
}

function blackout() {
  running = false;
  canvas.style.filter = 'none';

  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  setTimeout(() => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, H * 0.004, 0, Math.PI * 2);
    ctx.fill();

    setTimeout(startCycle, 1500);
  }, 2000);
}

startCycle();
</script>
</body>
</html>
