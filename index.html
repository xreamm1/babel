<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery of Babel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #c { position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const text = document.createElement('canvas');
const tctx = text.getContext('2d');

const SCALE = 2; // внутреннее разрешение x2, чтобы зерно было 0.5 CSS-пикселя

function resize() {
  const w = window.innerWidth * SCALE, h = window.innerHeight * SCALE;
  canvas.width = w;
  canvas.height = h;
  text.width = w;
  text.height = h;
}
window.addEventListener('resize', resize);
resize();

const PHRASES = [
  ['SOMETHING', 'IS COMING'],
  ['THEY SEE', 'YOU'],
  ['WAKE', 'UP'],
  ['IT IS', 'HERE'],
  ['NOT', 'ALONE'],
  ['LOOK', 'BEHIND YOU'],
];
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function randomWord(len) {
  let s = '';
  for (let i = 0; i < len; i++) s += LETTERS[Math.floor(Math.random() * LETTERS.length)];
  return s;
}

function drawText() {
  const w = text.width, h = text.height;
  tctx.clearRect(0, 0, w, h);
  tctx.fillStyle = '#fff';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.font = `bold ${Math.round(w / 9)}px sans-serif`;

  let line1, line2;
  if (Math.random() < 0.15) {
    [line1, line2] = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  } else {
    line1 = randomWord(5 + Math.floor(Math.random() * 5));
    line2 = randomWord(4 + Math.floor(Math.random() * 6));
  }

  const cx = w * (0.3 + Math.random() * 0.4);
  const cy = h * (0.3 + Math.random() * 0.4);
  tctx.fillText(line1, cx, cy - h * 0.06);
  tctx.fillText(line2, cx, cy + h * 0.06);
}

const PIXEL = 1; // 1 внутренний пиксель = 0.5 CSS-пикселя

// "адрес" текущей картинки, как у книги в Библиотеке Вавилона
function randomAddress() {
  const chars = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < 24; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function drawAddress(W, H) {
  ctx.font = `${Math.round(H * 0.012)}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillText(randomAddress(), W - H * 0.015, H - H * 0.015);
}

// "залипшие" пиксели — несколько точек держат один цвет пару кадров
const stuckPixels = new Map();
function updateStuckPixels(W, H) {
  for (const [key, p] of stuckPixels) {
    p.life--;
    if (p.life <= 0) stuckPixels.delete(key);
  }
  if (Math.random() < 0.4) {
    const n = 5 + Math.floor(Math.random() * 20);
    for (let i = 0; i < n; i++) {
      const gx = Math.floor(Math.random() * W);
      const gy = Math.floor(Math.random() * H);
      const r = Math.random() < 0.5 ? 255 : 0;
      stuckPixels.set(`${gx},${gy}`, {
        r, g: Math.random() < 0.5 ? 255 : 0, b: Math.random() < 0.5 ? 255 : 0,
        life: 2 + Math.floor(Math.random() * 3),
      });
    }
  }
}

function paint() {
  const W = canvas.width, H = canvas.height;
  canvas.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;
  const pixel = PIXEL;
  const gw = Math.ceil(W / pixel), gh = Math.ceil(H / pixel);

  drawText();
  const mask = tctx.getImageData(0, 0, W, H).data;

  const boost = 22 + Math.random() * 12;
  const hue = Math.random() * Math.PI * 2;
  const boostR = boost * (0.5 + 0.5 * Math.cos(hue));
  const boostG = boost * (0.5 + 0.5 * Math.cos(hue - 2.094));
  const boostB = boost * (0.5 + 0.5 * Math.cos(hue + 2.094));

  updateStuckPixels(gw, gh);

  const img = ctx.createImageData(gw, gh);
  const data = img.data;
  for (let gy = 0; gy < gh; gy++) {
    for (let gx = 0; gx < gw; gx++) {
      const i = (gy * gw + gx) * 4;
      const stuck = stuckPixels.get(`${gx},${gy}`);
      if (stuck) {
        data[i] = stuck.r;
        data[i + 1] = stuck.g;
        data[i + 2] = stuck.b;
        data[i + 3] = 255;
        continue;
      }

      const px = Math.min(W - 1, gx * pixel);
      const py = Math.min(H - 1, gy * pixel);
      const mi = (py * W + px) * 4;
      const onText = mask[mi + 3] > 0;

      data[i] = Math.min(255, Math.random() * 256 + (onText ? boostR : 0));
      data[i + 1] = Math.min(255, Math.random() * 256 + (onText ? boostG : 0));
      data[i + 2] = Math.min(255, Math.random() * 256 + (onText ? boostB : 0));
      data[i + 3] = 255;
    }
  }

  const tmp = document.createElement('canvas');
  tmp.width = gw;
  tmp.height = gh;
  tmp.getContext('2d').putImageData(img, 0, 0);

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(tmp, 0, 0, gw, gh, 0, 0, W, H);

  // виньетка для атмосферы
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // редкий цифровой глитч
  if (Math.random() < 0.12) glitch(W, H);

  drawAddress(W, H);
}

function glitch(W, H) {
  const slices = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < slices; i++) {
    const y = Math.random() * H;
    const sh = 2 + Math.random() * H * 0.05;
    const dx = (Math.random() - 0.5) * W * 0.1;
    ctx.drawImage(canvas, 0, y, W, sh, dx, y, W, sh);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = `rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},0.06)`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

paint();
setInterval(paint, 1000);
</script>
</body>
</html>
